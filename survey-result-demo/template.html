<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>브랜드 상품 매니저 의견 취합 (시연) · 콜라보 캡모자 · 결과</title>
<style>
  :root { --bg:#f8f9fa; --surface:#fff; --ink:#202124; --sub:#5f6368; --faint:#80868b; --line:#e8eaed; --hover:#f1f3f4;
    --blue:#1a73e8; --blue-soft:#e8f0fe; --green:#188038; --green-soft:#e6f4ea; --red:#d93025; --amber:#b06000; --amber-soft:#fef7e0;
    --c-design:#1a73e8; --c-quality:#34a853; --c-price:#f9ab00; --c-none:#9aa0a6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --surface:#1e1f20; --ink:#e8eaed; --sub:#bdc1c6; --faint:#9aa0a6; --line:#3c4043; --hover:#2a2b2d;
    --blue:#8ab4f8; --blue-soft:#275951; --green:#81c995; --green-soft:#1e3a28; --red:#f28b82; --amber:#fdd663; --amber-soft:#3b3320;
    --c-design:#8ab4f8; --c-quality:#81c995; --c-price:#fdd663; --c-none:#80868b; } }
  * { box-sizing:border-box; } [hidden] { display:none !important; } button { font:inherit; color:inherit; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Google Sans","Noto Sans KR","Segoe UI",-apple-system,"Malgun Gothic",sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .top { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--line); }
  .top .in { max-width:1100px; margin:0 auto; padding:0 16px; height:56px; display:flex; align-items:center; gap:12px; }
  .top h1 { font-size:16px; margin:0; flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .top h1 small { color:var(--faint); font-weight:400; margin-left:8px; font-size:12px; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 80px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; }
  .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px; }
  .kpi { padding:16px; } .kpi .l { font-size:12px; color:var(--sub); } .kpi .v { font-size:28px; font-weight:600; letter-spacing:-.5px; line-height:1.2; margin-top:4px; } .kpi .d { font-size:12px; color:var(--faint); }
  .brand { display:flex; gap:6px; margin-bottom:14px; background:var(--hover); padding:4px; border-radius:12px; width:fit-content; }
  .brand button { border:0; background:none; border-radius:9px; padding:8px 18px; font-size:14px; color:var(--sub); cursor:pointer; }
  .brand button.on { background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .brand button span { font-size:12px; color:var(--faint); font-weight:400; margin-left:4px; }
  .brand button[data-b=sub].on { color:var(--red); }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tabs button { border:0; background:none; padding:10px 16px; font-size:14px; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button.on { color:var(--blue); border-color:var(--blue); font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .bar select, .bar input[type=search] { height:36px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); padding:0 12px; font:inherit; font-size:14px; }
  .bar input[type=search] { min-width:200px; flex:1; max-width:340px; }
  .chip { height:32px; padding:0 14px; border-radius:16px; border:1px solid var(--line); background:var(--surface); font-size:13px; cursor:pointer; } .chip.on { background:var(--blue-soft); color:var(--blue); border-color:transparent; font-weight:600; }
  .cat { padding:14px 16px; margin-bottom:14px; } .cat h2 { font-size:15px; margin:0 0 4px; } .cat .sub { font-size:12px; color:var(--faint); margin-bottom:10px; }
  .cat .cr { display:grid; grid-template-columns:150px 118px 1fr 240px; gap:12px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px; } .cat .cr:first-of-type { border-top:0; }
  .cat .cn { font-weight:600; } .cat .cn small { display:block; font-weight:400; color:var(--faint); font-size:11px; }
  .cat .top { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:16px; color:#fff; font-weight:700; font-size:14px; white-space:nowrap; } .cat .top.dk { color:#202124; } .cat .top small { font-weight:500; font-size:11px; opacity:.9; }
  .cat .dist { margin:0; height:22px; } .cat .cc { display:flex; gap:8px; font-size:12px; color:var(--sub); white-space:nowrap; justify-content:flex-end; } .cat .cc i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; } .cat .cc b { color:var(--ink); } .cat .cc span.hi { background:var(--hover); border-radius:6px; padding:1px 6px; font-weight:700; color:var(--ink); }
  .cat .cg { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; } .cat .cg span { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); border:1px solid var(--line); border-radius:14px; padding:3px 10px; } .cat .cg i { display:inline-block; width:9px; height:9px; border-radius:2px; } .cat .cg b { color:var(--ink); }
  @media (max-width:640px) { .cat .cr { grid-template-columns:1fr 118px; gap:6px; } .cat .dist, .cat .cc { grid-column:1 / -1; } .cat .cc { justify-content:flex-start; flex-wrap:wrap; } }
  .sl { margin:10px 0 2px; border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:12px; }
  .sl .sh { display:flex; flex-wrap:wrap; gap:4px 14px; padding:7px 10px; background:var(--hover); color:var(--sub); } .sl .sh b { color:var(--ink); font-weight:600; } .sl .sh .rt { margin-left:auto; } .sl .sh .rt b { color:var(--blue); font-size:13px; }
  .sl table { width:100%; border-collapse:collapse; } .sl th { font-weight:500; color:var(--faint); text-align:right; padding:4px 10px; border-top:1px solid var(--line); font-size:11px; } .sl td { text-align:right; padding:4px 10px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; } .sl th:first-child, .sl td:first-child { text-align:left; }
  .sl td.r { font-weight:700; } .sl td.r.hi { color:var(--green); } .sl td.r.lo { color:var(--red); }
  .cg2 { display:grid; grid-template-columns:1fr 1fr; column-gap:28px; row-gap:0; margin-top:12px; position:relative; }
  .cg2::before { content:''; position:absolute; left:50%; top:0; bottom:0; width:3px; border-radius:2px; background:var(--sub); opacity:.55; transform:translateX(-50%); }
  .cg2 > div { border:1px solid var(--line); border-top:0; min-width:0; } .cg2 > .ch { border-top:1px solid var(--line); border-radius:10px 10px 0 0; } .cg2 > div:nth-last-child(-n+2) { border-radius:0 0 10px 10px; }
  .cg2 .ch { padding:10px 12px; font-size:17px; font-weight:800; background:var(--hover); border-bottom:2px solid currentColor !important; } .cg2 .ch.d { color:var(--blue); } .cg2 .ch.o { color:var(--amber); } .cg2 .ch small { font-weight:500; color:var(--faint); margin-left:8px; font-size:13px; }
  .cg2 .gh { display:flex; align-items:center; gap:8px; padding:5px 10px; font-size:12px; color:var(--sub); background:color-mix(in srgb, var(--hover) 50%, transparent); border-bottom:1px solid var(--line); } .cg2 .gh b { color:var(--ink); }
  .gb { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:6px; font-weight:800; font-size:12px; color:#fff; } .gb.A { background:#1a73e8; } .gb.B { background:#188038; } .gb.C { background:#80868b; } .gb.X { background:#b06000; } .gb.T { background:#d93025; }
  .cg2 .gl { padding:0 10px 4px; } .cg2 .op { padding:6px 0; font-size:13px; } .cg2 .op .mt { margin-bottom:1px; }
  .cg2 .none { font-size:12px; color:var(--faint); padding:10px; }
  .opsum { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; color:var(--sub); margin-top:14px; border-top:1px dashed var(--line); padding-top:10px; } .opsum b { color:var(--ink); }
  details.skipped { margin-top:6px; font-size:12px; color:var(--faint); } details.skipped summary { cursor:pointer; } details.skipped .op { font-size:12px; padding:4px 0; }
  @media (max-width:640px) { .cg2 { grid-template-columns:1fr; } .cg2::before { display:none; } .cg2 > div { border-radius:0 !important; } }
  .rk { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:800; padding:1px 7px; border-radius:9px; color:#fff; background:#c0392b; white-space:nowrap; } .rk.r2 { background:#d4870b; } .rk.r3 { background:#5f6368; }
  .tops { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; color:var(--sub); margin:8px 0 0; } .tops b { color:var(--ink); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--sub); margin:0 0 12px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .models { display:grid; grid-template-columns:1fr; gap:14px; }
  .m { padding:14px; border:2.5px solid var(--sub); margin-bottom:18px; } .m .h { display:flex; gap:12px; align-items:flex-start; }
  .m img { width:96px; aspect-ratio:146/104; object-fit:contain; background:#fff; border:1px solid var(--line); border-radius:8px; flex:none; }
  .m .nm { font-weight:600; font-size:15px; line-height:1.4; } .m .sb { font-size:12px; color:var(--faint); margin-top:2px; }
  .dist { display:flex; height:26px; border-radius:8px; overflow:hidden; background:var(--line); margin:14px 0 8px; }
  .dist span { display:grid; place-items:center; font-size:12px; font-weight:600; color:#fff; min-width:0; } .dist span.dk { color:#202124; }
  .rows { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; font-size:12px; color:var(--sub); } .rows b { color:var(--ink); font-size:14px; display:block; } .rows div i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  .oplist { margin-top:14px; border-top:1px dashed var(--line); padding-top:10px; } .oph { font-size:12px; font-weight:600; color:var(--sub); margin-bottom:4px; }
  .op { border-top:1px solid var(--line); padding:10px 0; font-size:14px; } .oplist .op:first-of-type { border-top:0; }
  .op .mt { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--faint); margin-bottom:3px; } .op .mt b { color:var(--ink); font-weight:600; }
  .tag { display:inline-block; padding:1px 9px; border-radius:10px; font-size:12px; font-weight:600; color:#fff; } .tag.price { color:#202124; }
  .op p { margin:0; white-space:pre-wrap; word-break:break-word; }
  .gh { font-size:13px; font-weight:600; margin:22px 2px 8px; display:flex; justify-content:space-between; } .gh span { color:var(--faint); font-weight:400; } .gh.sub { color:var(--red); }
  .st { display:grid; grid-template-columns:minmax(120px,220px) 1fr 110px; gap:12px; align-items:center; padding:11px 16px; border-top:1px solid var(--line); font-size:14px; } .st:first-child { border-top:0; }
  .track { height:8px; border-radius:4px; background:var(--line); overflow:hidden; } .track i { display:block; height:100%; background:var(--blue); border-radius:4px; } .track.full i { background:var(--green); }
  .st .pc { text-align:right; font-variant-numeric:tabular-nums; color:var(--sub); }
  .sbg { display:inline-block; font-size:11px; font-weight:600; padding:1px 8px; border-radius:10px; margin-left:4px; vertical-align:1px; } .sbg.new { background:var(--amber-soft); color:var(--amber); } .sbg.mid { background:var(--blue-soft); color:var(--blue); } .sbg.done { background:var(--green-soft); color:var(--green); }
  .qgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; margin-top:12px; } .qr { display:grid; grid-template-columns:150px 1fr 70px; gap:8px; align-items:center; font-size:13px; padding:3px 0; } .qr .lbl { color:var(--sub); } .qb { height:9px; border-radius:4px; background:var(--line); overflow:hidden; } .qb i { display:block; height:100%; border-radius:4px; } .qr .n { text-align:right; font-variant-numeric:tabular-nums; }
  @media (max-width:640px) { .qgrid { grid-template-columns:1fr; } }
  .btn { height:34px; padding:0 14px; border-radius:17px; border:1px solid var(--line); background:var(--surface); font-size:13px; cursor:pointer; white-space:nowrap; } .btn:hover { background:var(--hover); }
  .cut { display:inline-block; margin-left:8px; padding:1px 9px; border-radius:10px; background:var(--red); color:#fff; font-size:12px; font-weight:700; vertical-align:2px; white-space:nowrap; }
  .empty { text-align:center; color:var(--faint); padding:48px 0; }
  .note { font-size:12px; color:var(--faint); margin:-8px 0 16px; }
  @media (max-width:900px) { .kpis { grid-template-columns:1fr 1fr; } .st { grid-template-columns:1fr 90px; } .st .track { grid-column:1 / -1; order:3; } }
</style>
</head>
<body>
<header class="top"><div class="in"><h1>브랜드 상품 매니저 의견 취합 (시연) · 콜라보 캡모자 <small>결과 · <span id="asof"></span> 기준</small></h1><button class="btn" id="csv">자유의견 CSV</button></div></header>
<main class="wrap">
  <div class="kpis">
    <div class="card kpi"><div class="l">전체 진행률</div><div class="v" id="k1">–</div><div class="d" id="k1d"></div></div>
    <div class="card kpi"><div class="l">작성 완료 응답</div><div class="v" id="k2">–</div><div class="d">품번 × 응답자 기준</div></div>
    <div class="card kpi"><div class="l">참여 응답자</div><div class="v" id="k3">–</div><div class="d" id="k3d"></div></div>
    <div class="card kpi"><div class="l">완료 매장</div><div class="v" id="k4">–</div><div class="d" id="k4d"></div></div>
    <div class="card kpi" style="border-color:var(--amber)"><div class="l">캡모자 상품성 조사</div><div class="v" id="k5">–</div><div class="d">캡모자 출고 매장 중 완료</div></div>
  </div>
  <div class="brand" id="brand"><button class="on" data-b="">전체 <span></span></button><button data-b="sub">서브라인 상품 <span></span></button><button data-b="main">메인 상품 <span></span></button></div>
  <div class="card cat" id="cat"></div>
  <div class="tabs" id="tabs"><button class="on" data-t="models">품번별 결과</button><button data-t="ops">의견 모음</button><button data-t="stores">매장 참여 현황</button></div>
  <section id="t-models">
    <div class="bar">
      <select id="sort"><option value="code" selected>품번 순</option><option value="n">응답 많은 순</option><option value="design">디자인 비율 높은 순</option><option value="quality">품질 비율 높은 순</option><option value="price">가격 비율 높은 순</option><option value="none">반응 없음 비율 높은 순</option><option value="rate">판매율 높은 순</option><option value="rate_lo">판매율 낮은 순</option></select>
      <input type="search" id="mq" placeholder="품번·상품명 검색">
    </div>
    <div class="legend"><span><i style="background:var(--c-design)"></i>디자인</span><span><i style="background:var(--c-quality)"></i>품질</span><span><i style="background:var(--c-price)"></i>가격</span><span><i style="background:var(--c-none)"></i>반응 없음</span><span style="margin-left:auto">질문: 고객이 이 상품에서 가장 많이 언급한 점</span></div>
    <div class="note">응답 1건 = 매니저 1명 × 품번 1개. 같은 매장에서 두 명이 답하면 2건으로 집계. 콜라보 캡모자(DEMOAP900P)는 출고 매장 대상 상품성 조사 3문항(고객 반응 / 지적한 점 / 자유의견). <span id="salesNote"></span></div>
    <div class="models" id="models"></div>
  </section>
  <section id="t-ops" hidden>
    <div class="bar">
      <button class="chip on" data-m="">전체</button><button class="chip" data-m="design">디자인</button><button class="chip" data-m="quality">품질</button><button class="chip" data-m="price">가격</button><button class="chip" data-m="none">반응 없음</button><button class="chip" data-m="cap" style="border-color:var(--amber);color:var(--amber)">캡모자</button>
      <select id="ogr"><option value="">전체 등급</option><option value="A">A 등급</option><option value="B">B 등급</option><option value="C">C 등급</option><option value="X">등급 미지정</option></select><select id="oc"><option value="">전체 구분</option><option value="design">디자인</option><option value="other">디자인 외</option><option value="skip">제외(반응 없음 등)</option></select><select id="og"><option value="">전체 유통</option></select><select id="os"><option value="">전체 품번</option></select>
      <input type="search" id="oq" placeholder="의견·매장 검색">
    </div>
    <div class="card" style="padding:6px 16px" id="ops"></div>
  </section>
  <section id="t-stores" hidden>
    <div class="bar"><button class="chip on" data-s="">전체</button><button class="chip" data-s="done">완료</button><button class="chip" data-s="mid">일부 작성</button><button class="chip" data-s="new">미작성</button><span id="scount" style="font-size:13px;color:var(--sub)"></span></div>
    <div id="stores"></div>
  </section>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const MCN = { design:'디자인', quality:'품질', price:'가격', none:'반응 없음' }, KEYS = Object.keys(MCN);
const Q1N = { great:'매우 좋음', good:'좋음', soso:'보통', weak:'약함', none:'거의 없음' }, Q1K = Object.keys(Q1N), Q1C = { great:'#188038', good:'#34a853', soso:'#f9ab00', weak:'#e8710a', none:'#9aa0a6' };
const Q2N = { price:'가격(49,000원) 부담', size:'사이즈 F 안 맞음', logo:'로고·디자인 호불호', color:'컬러 부족', material:'소재·마감', none:'지적 없음' };
const isCap = c => c === D.cap;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab = 'models', mc = '', sf = '', brand = '';
const mname = c => (D.models.find(m => m.code === c) || {}).name || c;
const brandOf = m => m.name.startsWith('[서브]') ? 'sub' : 'main';
const brandOfCode = c => { const m = D.models.find(x => x.code === c); return m ? brandOf(m) : 'main'; };
const inBrand = m => !brand || brandOf(m) === brand;
const stState = s => s.done >= s.total ? 'done' : s.done > 0 ? 'mid' : 'new';
const STN = { new:'미작성', mid:'일부 작성', done:'완료' };

$('asof').textContent = D.now.slice(0, 10).replace(/-/g, '.');
if (D.sales_asof) $('salesNote').textContent = `판매 수치는 ${D.sales_asof} 기준(입고대비 판매율, 원가·TAG가·판매가·최초출고일은 같은 파일의 기타사항 기준).`;
(function kpis() {
  const t = D.stores.reduce((a, s) => a + s.total, 0), d = D.stores.reduce((a, s) => a + s.done, 0), fin = D.stores.filter(s => s.done >= s.total).length;
  $('k1').textContent = (t ? Math.round(d / t * 100) : 0) + '%'; $('k1d').textContent = `${d.toLocaleString()} / ${t.toLocaleString()} (매장 × 품번)`;
  $('k2').textContent = D.overall.responses.toLocaleString();
  $('k3').textContent = D.overall.people.toLocaleString(); $('k3d').textContent = `${D.stores.filter(s => s.people).length}개 매장 참여`;
  $('k4').textContent = fin; $('k4d').textContent = `전체 ${D.stores.length}개 매장`;
  $('k5').textContent = `${D.overall.capDone} / ${D.overall.capStores}`;
  $('og').innerHTML += D.groups.map(g => `<option>${esc(g)}</option>`).join('');
  $('os').innerHTML += D.models.map(m => `<option value="${m.code}">${esc(m.code)} ${esc(m.name)}</option>`).join('');
})();


/* ---- 복종별 객관식 분포 (품번 코드 5~6번째 글자 기준, 브랜드 탭 연동) ---- */
const CAT = { AT:'벨트', AP:'모자', AC:'액세서리', DJ:'데님 자켓', DP:'데님 팬츠', DW:'다운 점퍼', JP:'점퍼·아우터', LI:'레더 자켓', KC:'니트 가디건·집업', KT:'니트 풀오버', SH:'셔츠', TJ:'스웨트 집업·후드', TS:'맨투맨·후디·티셔츠', TP:'스웨트 팬츠', PT:'팬츠' };
const catOf = m => CAT[m.code.slice(4, 6)] || '기타';
function cats() {

/* ---- 판매 현황 (상품판매진도추이 + 상품종합집계표) ---- */
const won = v => v == null ? '–' : Math.round(v).toLocaleString();
const rateCls = r => r == null ? '' : r >= 30 ? 'hi' : r < 10 ? 'lo' : '';
// 원가 배수: TAG가 ÷ 원가 (정상가 기준), 판매가 ÷ 원가 (판매가 기준, 인하 시 함께 표시)
function mult(x, m) {
  const c = x.cost ?? x.unit_cost, tag = x.tag, pr = x.price ?? m.sale; if (!c) return '';
  const t = tag ? (tag / c).toFixed(2) : null, p = pr ? (pr / c).toFixed(2) : null;
  return `<span>원가 배수 <b>${t ?? '–'}</b>${p && p !== t ? ` <span style="color:var(--red)">(판매가 기준 ${p})</span>` : ''}</span>`;
}
const isCut = m => !!(m.sales && m.sales.tag && (m.sales.price ?? m.sale) && (m.sales.price ?? m.sale) < m.sales.tag);
const cutPct = m => Math.round((1 - (m.sales.price ?? m.sale) / m.sales.tag) * 100);
const cutBadge = m => isCut(m) ? `<span class="cut">가격인하 ${cutPct(m)}%</span>` : '';

  return `<div class="sl"><div class="sh"><span>TAG가 <b>${won(x.tag)}</b></span><span>${isCut(m) ? '현판가' : '판매가'} <b${isCut(m) ? ' style="color:var(--red)"' : ''}>${won(x.price ?? m.sale)}</b>${isCut(m) ? ` <span style="color:var(--red);font-weight:700">TAG 대비 ${cutPct(m)}%↓${x.price_changed ? ' · ' + x.price_changed.slice(5).replace('-', '/') + ' 적용' : ''}</span>` : ''}</span><span>원가 <b>${won(x.cost ?? x.unit_cost)}</b></span>${mult(x, m)}<span>최초출고 <b>${d(x.first_ship)}</b></span><span class="rt">입고 <b style="color:var(--ink)">${x.in.toLocaleString()}</b> · 판매 <b style="color:var(--ink)">${x.sold.toLocaleString()}</b> · 입고대비 판매율 <b>${x.rate == null ? '–' : x.rate + '%'}</b></span></div>
    <table><tr><th>색상</th><th>최초출고</th><th>기획</th><th>입고</th><th>판매</th><th>판매율</th><th>매장재고</th><th>본사재고</th></tr>${x.colors.map(c => `<tr><td>${esc(c.name)}</td><td>${d(c.first_ship)}</td><td>${c.plan.toLocaleString()}</td><td>${c.in.toLocaleString()}</td><td>${c.sold.toLocaleString()}</td><td class="r ${rateCls(c.rate)}">${c.rate == null ? '–' : c.rate + '%'}</td><td>${c.store_stock.toLocaleString()}</td><td>${c.hq_stock.toLocaleString()}</td></tr>`).join('')}</table></div>`;

/* ---- 자유의견: 매장 등급(A/B/C) × 구분(디자인 / 디자인 외) ---- */
const GRADES = ['A', 'B', 'C', 'X'], GN = { T:'서브라인 매장', A:'A 등급', B:'B 등급', C:'C 등급', X:'등급 미지정' };
const CATN = { design:'디자인', other:'디자인 외', skip:'제외' };
const topOf = (style, store) => (D.models.find(m => m.code === style)?.top || []).find(t => t.store === store);
const rankBadge = (style, store) => { const t = topOf(style, store); return t ? `<span class="rk r${t.rank}" title="이 품번 판매 ${t.rank}위 매장">판매 ${t.rank}위 · ${t.qty.toLocaleString()}장</span>` : ''; };
const mcTag = o => isCap(o.style) ? `<span class="tag" style="background:${Q1C[o.mc] || 'var(--faint)'}">${Q1N[o.mc] || '-'}</span>${(o.extra || []).length ? `<span style="color:var(--sub)">${o.extra.map(k => Q2N[k] || k).join(' / ')}</span>` : ''}` : o.mc ? `<span class="tag ${o.mc}" style="background:var(--c-${o.mc})">${MCN[o.mc]}</span>` : '';
const opHtml = o => `<div class="op"><div class="mt">${mcTag(o)}<b>${esc(o.store)}</b>${rankBadge(o.style, o.store)}</div><p>${esc(o.text)}</p></div>`;
const THEB_STORES = new Set(['서브 A점', '서브 B점', '서브 C점', '서브 D점', '서브 E점', '서브 F점', '서브 G점']);   // 서브라인 상품: 이 매장 의견은 등급과 별개로 맨 위 '서브라인 매장' 칸에
function gradeGrid(ops, isTheB) {
  const use = ops.filter(o => o.cat !== 'skip'), skipped = ops.filter(o => o.cat === 'skip');
  let D_ = use.filter(o => o.cat === 'design'), O_ = use.filter(o => o.cat === 'other');
  let h = `<div class="opsum"><span>자유의견 <b>${ops.length}</b>건</span><span style="color:var(--blue)">디자인 <b>${D_.length}</b></span><span style="color:var(--amber)">디자인 외 <b>${O_.length}</b></span><span>반응 없음 등 제외 <b>${skipped.length}</b></span></div>`;
  // 1행: 열 제목, 이후 등급마다 1행(왼쪽 디자인, 오른쪽 디자인 외) → 같은 등급 칸의 높이가 맞춰진다
  let rows = 0;
  let cells = `<div class="ch d">디자인 <small>${D_.length}건 · 품질·디테일·소재·핏·컬러</small></div><div class="ch o">디자인 외 <small>${O_.length}건 · 가격·날씨·물량 등</small></div>`;
  const cell = (g, xs) => `<div><div class="gh"><span class="gb ${g}">${g === 'X' ? '–' : g === 'T' ? 'B' : g}</span><b>${GN[g]}</b><span>${xs.length}건</span></div>${xs.length ? `<div class="gl">${xs.map(opHtml).join('')}</div>` : '<div class="none">없음</div>'}</div>`;

  // 등급 칸 안 정렬: 이 품번 판매 순위(1→3위) 먼저, 순위 없는 매장은 매장명 가나다순
  const byRank = (a, b) => ((topOf(a.style, a.store)?.rank ?? 99) - (topOf(b.style, b.store)?.rank ?? 99)) || a.store.localeCompare(b.store, 'ko');
  if (isTheB) { const tb = o => THEB_STORES.has(o.store); const td = D_.filter(tb).sort(byRank), to = O_.filter(tb).sort(byRank); if (td.length || to.length) { cells += cell('T', td) + cell('T', to); rows++; } D_ = D_.filter(o => !tb(o)); O_ = O_.filter(o => !tb(o)); }
  for (const g of GRADES) { const dg = D_.filter(o => (o.grade || 'X') === g).sort(byRank), og = O_.filter(o => (o.grade || 'X') === g).sort(byRank); if (!dg.length && !og.length) continue; cells += cell(g, dg) + cell(g, og); rows++; }
  if (!rows) cells += '<div class="none">없음</div><div class="none">없음</div>';
  h += `<div class="cg2">${cells}</div>`;
  if (skipped.length) h += `<details class="skipped"><summary>제외된 의견 ${skipped.length}건 보기 (반응 없음·정보 없음 등)</summary>${skipped.map(opHtml).join('')}</details>`;
  return h;
}

  const head = ['품번', '상품명', '매장등급', '유통', '매장', '구분', '객관식(고객 주요 언급)', '캡모자 지적한 점', '판매 상위', '자유의견', '응답일'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `시연_매장_자유의견${brand ? '_' + (brand === 'sub' ? 'sub' : 'main') : ''}_${D.now.slice(0, 10).replace(/-/g, '')}.csv`; a.click(); URL.revokeObjectURL(a.href);
};
models();
</script>
