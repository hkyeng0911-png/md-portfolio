    list.map(c => { const segs = KEYS.map(k => c.n ? c.dist[k] / c.n * 100 : 0), t = topOf(c), tp = c.n ? Math.round(c.dist[t] / c.n * 100) : 0;
      return `<div class="cr"><div class="cn">${esc(c.name)}<small>${c.models}품번 · 응답 ${c.n}건</small></div>
        <span class="top ${t === 'price' ? 'dk' : ''}" style="background:var(--c-${t})">${MCN[t]} ${tp}%<small>최다</small></span>
        <div class="dist">${KEYS.map((k, i) => c.dist[k] ? `<span class="${k === 'price' ? 'dk' : ''}" style="width:${segs[i]}%;background:var(--c-${k})" title="${MCN[k]} ${c.dist[k]}건">${segs[i] >= 10 ? Math.round(segs[i]) + '%' : ''}</span>` : '').join('')}</div>
        <div class="cc">${KEYS.map(k => `<span class="${k === t ? 'hi' : ''}"><i style="background:var(--c-${k})"></i>${MCN[k]} <b>${c.dist[k]}</b></span>`).join('')}</div></div>`; }).join('');
}
cats();


/* ---- 판매 현황 (상품판매진도추이 + 상품종합집계표) ---- */
const won = v => v == null ? '–' : Math.round(v).toLocaleString();
const rateCls = r => r == null ? '' : r >= 30 ? 'hi' : r < 10 ? 'lo' : '';
// 원가 배수: TAG가 ÷ 원가 (정상가 기준), 판매가 ÷ 원가 (판매가 기준, 인하 시 함께 표시)
function mult(x, m) {
  const c = x.cost ?? x.unit_cost, tag = x.tag, pr = x.price ?? m.sale; if (!c) return '';
  const t = tag ? (tag / c).toFixed(2) : null, p = pr ? (pr / c).toFixed(2) : null;
  return `<span>원가 배수 <b>${t ?? '–'}</b>${p && p !== t ? ` <span style="color:var(--red)">(판매가 기준 ${p})</span>` : ''}</span>`;
}
const isCut = m => !!(m.sales && m.sales.tag && (m.sales.price ?? m.sale) && (m.sales.price ?? m.sale) < m.sales.tag);
const cutPct = m => Math.round((1 - (m.sales.price ?? m.sale) / m.sales.tag) * 100);
const cutBadge = m => isCut(m) ? `<span class="cut">가격인하 ${cutPct(m)}%</span>` : '';
function salesBlock(m) {
  const x = m.sales; if (!x) return '';
  const d = v => v ? v.slice(5).replace('-', '/') : '–';
  return `<div class="sl"><div class="sh"><span>TAG가 <b>${won(x.tag)}</b></span><span>${isCut(m) ? '현판가' : '판매가'} <b${isCut(m) ? ' style="color:var(--red)"' : ''}>${won(x.price ?? m.sale)}</b>${isCut(m) ? ` <span style="color:var(--red);font-weight:700">TAG 대비 ${cutPct(m)}%↓${x.price_changed ? ' · ' + x.price_changed.slice(5).replace('-', '/') + ' 적용' : ''}</span>` : ''}</span><span>원가 <b>${won(x.cost ?? x.unit_cost)}</b></span>${mult(x, m)}<span>최초출고 <b>${d(x.first_ship)}</b></span><span class="rt">입고 <b style="color:var(--ink)">${x.in.toLocaleString()}</b> · 판매 <b style="color:var(--ink)">${x.sold.toLocaleString()}</b> · 입고대비 판매율 <b>${x.rate == null ? '–' : x.rate + '%'}</b></span></div>
    <table><tr><th>색상</th><th>최초출고</th><th>기획</th><th>입고</th><th>판매</th><th>판매율</th><th>매장재고</th><th>본사재고</th></tr>${x.colors.map(c => `<tr><td>${esc(c.name)}</td><td>${d(c.first_ship)}</td><td>${c.plan.toLocaleString()}</td><td>${c.in.toLocaleString()}</td><td>${c.sold.toLocaleString()}</td><td class="r ${rateCls(c.rate)}">${c.rate == null ? '–' : c.rate + '%'}</td><td>${c.store_stock.toLocaleString()}</td><td>${c.hq_stock.toLocaleString()}</td></tr>`).join('')}</table></div>`;
}


/* ---- 자유의견: 매장 등급(A/B/C) × 구분(디자인 / 디자인 외) ---- */
const GRADES = ['A', 'B', 'C', 'X'], GN = { T:'서브라인 매장', A:'A 등급', B:'B 등급', C:'C 등급', X:'등급 미지정' };
const CATN = { design:'디자인', other:'디자인 외', skip:'제외' };
const topOf = (style, store) => (D.models.find(m => m.code === style)?.top || []).find(t => t.store === store);
const rankBadge = (style, store) => { const t = topOf(style, store); return t ? `<span class="rk r${t.rank}" title="이 품번 판매 ${t.rank}위 매장">판매 ${t.rank}위 · ${t.qty.toLocaleString()}장</span>` : ''; };
const mcTag = o => isCap(o.style) ? `<span class="tag" style="background:${Q1C[o.mc] || 'var(--faint)'}">${Q1N[o.mc] || '-'}</span>${(o.extra || []).length ? `<span style="color:var(--sub)">${o.extra.map(k => Q2N[k] || k).join(' / ')}</span>` : ''}` : o.mc ? `<span class="tag ${o.mc}" style="background:var(--c-${o.mc})">${MCN[o.mc]}</span>` : '';
const opHtml = o => `<div class="op"><div class="mt">${mcTag(o)}<b>${esc(o.store)}</b>${rankBadge(o.style, o.store)}</div><p>${esc(o.text)}</p></div>`;
const THEB_STORES = new Set(['서브 A점', '서브 B점', '서브 C점', '서브 D점', '서브 E점', '서브 F점', '서브 G점']);   // 서브라인 상품: 이 매장 의견은 등급과 별개로 맨 위 '서브라인 매장' 칸에
function gradeGrid(ops, isTheB) {
  const use = ops.filter(o => o.cat !== 'skip'), skipped = ops.filter(o => o.cat === 'skip');
  let D_ = use.filter(o => o.cat === 'design'), O_ = use.filter(o => o.cat === 'other');
  let h = `<div class="opsum"><span>자유의견 <b>${ops.length}</b>건</span><span style="color:var(--blue)">디자인 <b>${D_.length}</b></span><span style="color:var(--amber)">디자인 외 <b>${O_.length}</b></span><span>반응 없음 등 제외 <b>${skipped.length}</b></span></div>`;
  // 1행: 열 제목, 이후 등급마다 1행(왼쪽 디자인, 오른쪽 디자인 외) → 같은 등급 칸의 높이가 맞춰진다
  let rows = 0;
  let cells = `<div class="ch d">디자인 <small>${D_.length}건 · 품질·디테일·소재·핏·컬러</small></div><div class="ch o">디자인 외 <small>${O_.length}건 · 가격·날씨·물량 등</small></div>`;
  const cell = (g, xs) => `<div><div class="gh"><span class="gb ${g}">${g === 'X' ? '–' : g === 'T' ? 'B' : g}</span><b>${GN[g]}</b><span>${xs.length}건</span></div>${xs.length ? `<div class="gl">${xs.map(opHtml).join('')}</div>` : '<div class="none">없음</div>'}</div>`;

  // 등급 칸 안 정렬: 이 품번 판매 순위(1→3위) 먼저, 순위 없는 매장은 매장명 가나다순
  const byRank = (a, b) => ((topOf(a.style, a.store)?.rank ?? 99) - (topOf(b.style, b.store)?.rank ?? 99)) || a.store.localeCompare(b.store, 'ko');
  if (isTheB) { const tb = o => THEB_STORES.has(o.store); const td = D_.filter(tb).sort(byRank), to = O_.filter(tb).sort(byRank); if (td.length || to.length) { cells += cell('T', td) + cell('T', to); rows++; } D_ = D_.filter(o => !tb(o)); O_ = O_.filter(o => !tb(o)); }
  for (const g of GRADES) { const dg = D_.filter(o => (o.grade || 'X') === g).sort(byRank), og = O_.filter(o => (o.grade || 'X') === g).sort(byRank); if (!dg.length && !og.length) continue; cells += cell(g, dg) + cell(g, og); rows++; }
  if (!rows) cells += '<div class="none">없음</div><div class="none">없음</div>';
  h += `<div class="cg2">${cells}</div>`;
  if (skipped.length) h += `<details class="skipped"><summary>제외된 의견 ${skipped.length}건 보기 (반응 없음·정보 없음 등)</summary>${skipped.map(opHtml).join('')}</details>`;
  return h;
}

function models() {
  const kw = $('mq').value.trim().toLowerCase(), by = $('sort').value, pct = (m, k) => m.n ? m.dist[k] / m.n : -1;
  const list = D.models.filter(m => inBrand(m) && (!kw || (m.code + m.name).toLowerCase().includes(kw)))
    .sort((a, b) => (b.cap ? 1 : 0) - (a.cap ? 1 : 0) || (by === 'code' ? a.code.localeCompare(b.code) : by === 'n' ? b.n - a.n || a.code.localeCompare(b.code) : by === 'rate' ? (b.sales?.rate ?? -1) - (a.sales?.rate ?? -1) : by === 'rate_lo' ? (a.sales?.rate ?? 999) - (b.sales?.rate ?? 999) : pct(b, by) - pct(a, by) || b.n - a.n));
  const capCard = m => {
    const ops = D.opinions.filter(o => o.style === m.code && o.text.trim());
    const row = (n, tot, col, name) => `<div class="qr"><span class="lbl">${name}</span><div class="qb"><i style="width:${tot ? n / Math.max(1, tot) * 100 : 0}%;background:${col}"></i></div><span class="n"><b>${n}</b> <span style="color:var(--faint);font-size:12px">${tot ? Math.round(n / tot * 100) : 0}%</span></span></div>`;
    const top1 = Math.max(...Q1K.map(k => m.dist[k])), top2 = Math.max(...Object.keys(Q2N).map(k => m.q2[k]));
    return `<article class="card m" style="border-color:var(--amber)"><div class="h"><img src="${esc(m.img)}" alt="" loading="lazy"><div><div class="nm">${esc(m.name)}${cutBadge(m)}</div><div class="sb">${esc(m.code)} · 출고 ${m.stores}개 매장 · 응답 ${m.n}건 · <b style="color:var(--amber)">콜라보 캡모자 상품성 조사 (매장당 1회)</b></div></div></div>
      ${salesBlock(m)}${m.top && m.top.length ? `<div class="tops"><span>판매 상위 매장${D.top_asof ? ` <span style="color:var(--faint)">(${esc(D.top_asof)} 기준)</span>` : ''}</span>${m.top.map(t => `<span><span class="rk r${t.rank}">${t.rank}위</span> <b>${esc(t.store)}</b> ${t.qty.toLocaleString()}장</span>`).join('')}</div>` : ''}
      <div class="qgrid"><div><div class="oph">1. 매장에서 고객 반응</div>${Q1K.map(k => row(m.dist[k], m.n, Q1C[k], (m.dist[k] && m.dist[k] === top1 ? '★ ' : '') + Q1N[k])).join('')}</div>
      <div><div class="oph">2. 고객이 지적한 점 (최대 2개 · ${m.q2n}매장)</div>${Object.keys(Q2N).map(k => row(m.q2[k], m.q2n, k === 'none' ? '#9aa0a6' : 'var(--c-design)', (m.q2[k] && m.q2[k] === top2 ? '★ ' : '') + Q2N[k])).join('')}</div></div>
      ${gradeGrid(ops, true)}</article>`;
  };
  $('models').innerHTML = list.length ? list.map(m => {
    if (m.cap) return capCard(m);
    const segs = KEYS.map(k => m.n ? m.dist[k] / m.n * 100 : 0);
    const bar = KEYS.map((k, i) => m.dist[k] ? `<span class="${k === 'price' ? 'dk' : ''}" style="width:${segs[i]}%;background:var(--c-${k})" title="${MCN[k]} ${m.dist[k]}건">${segs[i] >= 12 ? Math.round(segs[i]) + '%' : ''}</span>` : '').join('');
    const ops = D.opinions.filter(o => o.style === m.code && o.text.trim());
    return `<article class="card m"><div class="h"><img src="${esc(m.img)}" alt="" loading="lazy"><div><div class="nm">${esc(m.name)}${cutBadge(m)}</div><div class="sb">${esc(m.code)} · 출고 ${m.stores}개 매장 · 응답 ${m.n}건</div></div></div>
      ${salesBlock(m)}${m.top && m.top.length ? `<div class="tops"><span>판매 상위 매장${D.top_asof ? ` <span style="color:var(--faint)">(${esc(D.top_asof)} 기준)</span>` : ''}</span>${m.top.map(t => `<span><span class="rk r${t.rank}">${t.rank}위</span> <b>${esc(t.store)}</b> ${t.qty.toLocaleString()}장</span>`).join('')}</div>` : ''}
      <div class="dist">${bar}</div>
      <div class="rows">${KEYS.map(k => `<div><i style="background:var(--c-${k})"></i>${MCN[k]}<b>${m.dist[k]}건 <span style="font-weight:400;color:var(--faint);font-size:12px">${m.n ? Math.round(m.dist[k] / m.n * 100) : 0}%</span></b></div>`).join('')}</div>
      ${gradeGrid(ops, true)}</article>`;
  }).join('') : '<div class="empty">조건에 맞는 품번이 없습니다.</div>';
}
$('sort').onchange = $('mq').oninput = models;

function ops() {
  const g = $('og').value, s = $('os').value, kw = $('oq').value.trim().toLowerCase(), gr = $('ogr').value, oc = $('oc').value;
  const list = D.opinions.filter(o => o.text.trim() && (!brand || brandOfCode(o.style) === brand) && (!mc || (mc === 'cap' ? isCap(o.style) : o.mc === mc && !isCap(o.style))) && (!g || o.group === g) && (!gr || (o.grade || 'X') === gr) && (!oc || o.cat === oc) && (!s || o.style === s) && (!kw || (o.text + o.store + mname(o.style)).toLowerCase().includes(kw)));
  $('ops').innerHTML = list.length ? `<div style="font-size:12px;color:var(--faint);padding:8px 0">${list.length}건</div>` + list.map(o => `<div class="op"><div class="mt">${mcTag(o)}<span class="gb ${o.grade || 'X'}" title="매장 등급">${o.grade || '–'}</span><b>${esc(o.store)}</b>${rankBadge(o.style, o.store)}<span style="color:${o.cat === 'design' ? 'var(--blue)' : o.cat === 'other' ? 'var(--amber)' : 'var(--faint)'};font-weight:600">${CATN[o.cat] || ''}</span><span>${esc(o.style)} ${esc(mname(o.style))}</span><span style="margin-left:auto">${esc(o.at.slice(5, 10))}</span></div><p>${esc(o.text)}</p></div>`).join('') : '<div class="empty">조건에 맞는 의견이 없습니다.</div>';
}
$('t-ops').querySelector('.bar').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; mc = b.dataset.m; [...document.querySelectorAll('#t-ops .chip')].forEach(x => x.classList.toggle('on', x === b)); ops(); });
$('og').onchange = $('os').onchange = $('oq').oninput = $('ogr').onchange = $('oc').onchange = ops;

function stores() {
  const cnt = { new:0, mid:0, done:0 }; D.stores.forEach(s => cnt[stState(s)]++);
  $('scount').textContent = `완료 ${cnt.done} · 일부 작성 ${cnt.mid} · 미작성 ${cnt.new} / 전체 ${D.stores.length}`;
  $('stores').innerHTML = D.groups.map(g => {
    const gx = D.stores.filter(s => s.group === g), xs = gx.filter(s => !sf || stState(s) === sf); if (!xs.length) return '';
    const t = gx.reduce((a, s) => a + s.total, 0), d = gx.reduce((a, s) => a + s.done, 0);
    return `<div class="gh ${g === '서브라인 매장' ? 'sub' : ''}"><b>${esc(g)}</b><span>${gx.length}개 매장 · 진행 ${t ? Math.round(d / t * 100) : 0}%</span></div><div class="card">${xs.map(s => {
      const p = s.total ? Math.round(s.done / s.total * 100) : 0, st = stState(s);
      return `<div class="st"><span><b style="font-weight:500">${esc(s.name)}</b><span class="sbg ${st}">${STN[st]}</span>${s.cap ? `<span class="sbg ${s.capDone ? 'done' : 'new'}">캡 ${s.capDone ? '✓' : '미작성'}</span>` : ''}</span><div class="track ${st === 'done' ? 'full' : ''}"><i style="width:${p}%"></i></div><span class="pc">${s.done} / ${s.total} · ${p}%</span></div>`;
    }).join('')}</div>`;
  }).join('') || '<div class="empty">해당하는 매장이 없습니다.</div>';
}
$('t-stores').querySelector('.bar').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; sf = b.dataset.s; [...document.querySelectorAll('#t-stores .chip')].forEach(x => x.classList.toggle('on', x === b)); stores(); });

(function brandCounts() {
  const cnt = { '': D.models.length, sub: D.models.filter(m => brandOf(m) === 'sub').length, main: D.models.filter(m => brandOf(m) === 'main').length };
  [...$('brand').children].forEach(b => b.querySelector('span').textContent = cnt[b.dataset.b] + '품번');
})();
$('brand').onclick = e => { const b = e.target.closest('button'); if (!b) return; brand = b.dataset.b; [...$('brand').children].forEach(x => x.classList.toggle('on', x === b));
  $('os').innerHTML = '<option value="">전체 품번</option>' + D.models.filter(inBrand).map(m => `<option value="${m.code}">${esc(m.code)} ${esc(m.name)}</option>`).join('');
  cats(); ({ models, ops, stores })[tab](); };
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); for (const t of ['models', 'ops', 'stores']) $('t-' + t).hidden = t !== tab; ({ models, ops, stores })[tab](); };
/* ---- 자유의견 CSV (현재 브랜드 탭 기준, 응답자 이름 없음) ---- */
$('csv').onclick = () => {
  const Q1 = typeof Q1N !== 'undefined' ? Q1N : {}, Q2 = typeof Q2N !== 'undefined' ? Q2N : {};
  const CATK = { design:'디자인', other:'디자인 외', skip:'제외' };
  const rows = D.opinions.filter(o => o.text.trim() && (!brand || brandOfCode(o.style) === brand)).map(o => { const isC = isCap(o.style);
    const t = topOf(o.style, o.store);
    return [o.style, mname(o.style), o.grade || '', o.group, o.store, CATK[o.cat] || '', isC ? (Q1[o.mc] || '') : (MCN[o.mc] || ''), isC ? (o.extra || []).map(k => Q2[k] || k).join(' / ') : '', t ? `${t.rank}위 ${t.qty}장` : '', o.text.trim(), o.at.slice(0, 10)]; });
  const head = ['품번', '상품명', '매장등급', '유통', '매장', '구분', '객관식(고객 주요 언급)', '캡모자 지적한 점', '판매 상위', '자유의견', '응답일'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `시연_매장_자유의견${brand ? '_' + (brand === 'sub' ? 'sub' : 'main') : ''}_${D.now.slice(0, 10).replace(/-/g, '')}.csv`; a.click(); URL.revokeObjectURL(a.href);
};
models();
</script>
</body>
